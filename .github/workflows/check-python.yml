name: Check loan model source
on:
  push:
    paths:
      - 'loan default project.py'
      - '.github/workflows/check-python.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile "loan default project.py"
